name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 33060
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME_PREFIX: fachdock_test

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 33060:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find src config public migrations templates tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: PHPUnit
        run: composer test

      - name: PHPStan
        run: composer analyse

      - name: Code style
        run: composer cs-check
