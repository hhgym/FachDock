name: CI

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: 33060
      TEST_DB_USERNAME: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME_PREFIX: fachdock_test
      FACHDOCK_V090_MIGRATIONS: /tmp/fachdock-v090/migrations

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 33060:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v0.9.0 upgrade baseline
        shell: bash
        run: |
          git rev-parse --verify 'refs/tags/v0.9.0^{commit}' >/dev/null
          rm -rf /tmp/fachdock-v090
          mkdir -p /tmp/fachdock-v090
          git archive v0.9.0 migrations | tar -x -C /tmp/fachdock-v090
          test -d "$FACHDOCK_V090_MIGRATIONS"
          test -f "$FACHDOCK_V090_MIGRATIONS/202609090006_production_hardening.php"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, zip
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        run: find src config public migrations templates tests -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: PHPUnit including fresh-install and v0.9.0 upgrade gates
        run: composer test

      - name: PHPStan
        run: composer analyse

      - name: Code style
        run: composer cs-check

  publish-develop-update:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: fachdock-develop-update
      cancel-in-progress: true

    steps:
      - name: Checkout verified develop commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, zip
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Build rolling develop package
        shell: bash
        run: |
          VERSION="$(php -r '$config = require "config/app.php"; echo $config["app"]["version"] ?? "";')"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "config/app.php contains an unsupported version: ${VERSION}"
            exit 1
          fi

          PACKAGE="FachDock-${VERSION}"
          mkdir -p "dist/${PACKAGE}"
          rsync -a ./ "dist/${PACKAGE}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tests/' \
            --exclude='storage/*' \
            --exclude='config/app.local.php' \
            --exclude='config/secrets.local.php' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpunit.xml.dist'

          curl -fsSL \
            'https://raw.githubusercontent.com/spdx/license-list-data/3ac5a9c241d97f95b22a5e366c9c841404a35639/text/AGPL-3.0-only.txt' \
            -o "dist/${PACKAGE}/LICENSE"

          mkdir -p "dist/${PACKAGE}/storage"
          touch "dist/${PACKAGE}/storage/.gitkeep"
          cd dist
          zip -qr FachDock-develop.zip "${PACKAGE}"
          sha256sum FachDock-develop.zip > FachDock-develop.zip.sha256

          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PREFIX="https://github.com/${GITHUB_REPOSITORY}/raw/refs/heads/develop-build"
          php -r '
            $manifest = [
              "version" => $argv[1],
              "build_id" => $argv[2],
              "built_at" => $argv[3],
              "zip_url" => $argv[4] . "/FachDock-develop.zip",
              "checksum_url" => $argv[4] . "/FachDock-develop.zip.sha256",
            ];
            file_put_contents("manifest.json", json_encode($manifest, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          ' "$VERSION" "$GITHUB_SHA" "$BUILT_AT" "$PREFIX"

          sha256sum -c FachDock-develop.zip.sha256
          unzip -t FachDock-develop.zip
          php -r '$data = json_decode(file_get_contents("manifest.json"), true, 512, JSON_THROW_ON_ERROR); if (($data["build_id"] ?? "") !== getenv("GITHUB_SHA")) { exit(1); }'

      - name: Publish rolling develop build branch
        shell: bash
        run: |
          PUBLISH_DIR="$(mktemp -d)"
          cp dist/FachDock-develop.zip "$PUBLISH_DIR/"
          cp dist/FachDock-develop.zip.sha256 "$PUBLISH_DIR/"
          cp dist/manifest.json "$PUBLISH_DIR/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan develop-build-publish
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp "$PUBLISH_DIR/"* .
          git add FachDock-develop.zip FachDock-develop.zip.sha256 manifest.json
          git commit -m "Develop build ${GITHUB_SHA}"
          git push --force origin HEAD:develop-build
