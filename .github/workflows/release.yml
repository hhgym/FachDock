name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve stable release version
        id: release
        shell: bash
        run: |
          CONFIG_VERSION="$(php -r '$config = require "config/app.php"; echo $config["app"]["version"] ?? "";')"
          if [[ ! "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "config/app.php must contain a stable SemVer version such as 0.1.0."
            exit 1
          fi

          TAG="v${CONFIG_VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match application version ${CONFIG_VERSION}."
            exit 1
          fi

          echo "version=${CONFIG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create stable tag for main release
        if: github.ref == 'refs/heads/main'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag ${TAG} already exists on a different commit."
              exit 1
            fi
            echo "Tag ${TAG} already exists on this commit."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Ensure release commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Stable releases must point to commits contained in main."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, zip
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Build release package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          PACKAGE="FachDock-${VERSION}"
          mkdir -p "dist/${PACKAGE}"
          rsync -a ./ "dist/${PACKAGE}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tests/' \
            --exclude='storage/*' \
            --exclude='config/app.local.php' \
            --exclude='config/secrets.local.php' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpunit.xml.dist'

          # Include the canonical AGPL-3.0-only text from a pinned SPDX revision.
          curl -fsSL \
            'https://raw.githubusercontent.com/spdx/license-list-data/3ac5a9c241d97f95b22a5e366c9c841404a35639/text/AGPL-3.0-only.txt' \
            -o "dist/${PACKAGE}/LICENSE"

          mkdir -p "dist/${PACKAGE}/storage"
          touch "dist/${PACKAGE}/storage/.gitkeep"
          cd dist
          zip -qr "${PACKAGE}.zip" "${PACKAGE}"
          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          PACKAGE="FachDock-${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$TAG" \
            "dist/${PACKAGE}.zip" \
            "dist/${PACKAGE}.zip.sha256" \
            --title "FachDock ${VERSION}" \
            --generate-notes
