name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          CONFIG_VERSION="$(php -r '$config = require "config/app.php"; echo $config["app"]["version"] ?? "";')"
          if [[ ! "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "config/app.php must contain a supported SemVer version such as 1.0.0 or 1.0.0-rc.1."
            exit 1
          fi

          TAG="v${CONFIG_VERSION}"
          PRERELEASE=false
          if [[ "$CONFIG_VERSION" == *-rc.* ]]; then
            PRERELEASE=true
          fi

          echo "version=${CONFIG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Create release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | cut -f1)"
          if [[ -n "$REMOTE_SHA" ]]; then
            if [[ "$REMOTE_SHA" != "$GITHUB_SHA" ]]; then
              echo "Tag ${TAG} already exists on a different commit."
              exit 1
            fi
            echo "Tag ${TAG} already exists on this commit."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

      - name: Ensure release commit belongs to main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Releases must point to commits contained in main."
            exit 1
          }

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: curl, zip
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Build release package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          PACKAGE="FachDock-${VERSION}"
          mkdir -p "dist/${PACKAGE}"
          rsync -a ./ "dist/${PACKAGE}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='tests/' \
            --exclude='storage/*' \
            --exclude='config/app.local.php' \
            --exclude='config/secrets.local.php' \
            --exclude='.php-cs-fixer.dist.php' \
            --exclude='phpstan.neon.dist' \
            --exclude='phpunit.xml.dist'

          # Include the canonical AGPL-3.0-only text from a pinned SPDX revision.
          curl -fsSL \
            'https://raw.githubusercontent.com/spdx/license-list-data/3ac5a9c241d97f95b22a5e366c9c841404a35639/text/AGPL-3.0-only.txt' \
            -o "dist/${PACKAGE}/LICENSE"

          mkdir -p "dist/${PACKAGE}/storage"
          touch "dist/${PACKAGE}/storage/.gitkeep"
          cd dist
          zip -qr "${PACKAGE}.zip" "${PACKAGE}"
          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"

      - name: Verify release package
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          PACKAGE="FachDock-${VERSION}"
          cd dist
          sha256sum -c "${PACKAGE}.zip.sha256"
          unzip -t "${PACKAGE}.zip"
          rm -rf smoke
          mkdir smoke
          unzip -q "${PACKAGE}.zip" -d smoke

          ROOT="smoke/${PACKAGE}"
          test -f "${ROOT}/public/index.php"
          test -f "${ROOT}/vendor/autoload.php"
          test -d "${ROOT}/migrations"
          test -f "${ROOT}/LICENSE"
          test ! -e "${ROOT}/tests"
          test ! -e "${ROOT}/.github"
          test ! -e "${ROOT}/config/app.local.php"
          test ! -e "${ROOT}/config/secrets.local.php"

          PACKAGE_VERSION="$(php -r '$config = require $argv[1]; echo $config["app"]["version"] ?? "";' "${ROOT}/config/app.php")"
          test "$PACKAGE_VERSION" = "$VERSION"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          PACKAGE="FachDock-${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; refusing to overwrite it."
            exit 1
          fi

          RELEASE_FLAGS=(--title "FachDock ${VERSION}" --verify-tag)
          if [[ "$PRERELEASE" == "true" ]]; then
            RELEASE_FLAGS+=(--prerelease --latest=false)
          fi

          NOTES_FILE="docs/RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$NOTES_FILE" ]]; then
            RELEASE_FLAGS+=(--notes-file "$NOTES_FILE")
          else
            RELEASE_FLAGS+=(--generate-notes)
          fi

          gh release create "$TAG" \
            "dist/${PACKAGE}.zip" \
            "dist/${PACKAGE}.zip.sha256" \
            "${RELEASE_FLAGS[@]}"